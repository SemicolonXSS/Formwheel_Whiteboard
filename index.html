<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Formwheel Whiteboard — 함께 그리기</title><meta name="description" content="친구와 실시간으로 그림을 그리는 Formwheel 공동 화이트보드">
<link rel="icon" href="https://semicolonxss.github.io/Formwheel/assets/formwheel-favicon.svg">
<style>
:root{color-scheme:dark;--bg:#101427;--panel:#1b2138;--border:#374160;--text:#eff2ff;--muted:#aeb9d1;--accent:#8270ff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px system-ui,sans-serif}button,input{font:inherit}button{cursor:pointer;border:1px solid var(--border);border-radius:10px;padding:9px 12px;background:#303958;color:white}button:hover{filter:brightness(1.14)}button:disabled{opacity:.45;cursor:not-allowed}.primary,.selected{background:#6353c9;border-color:#998df7}input:not([type=color]):not([type=range]){background:#10172a;border:1px solid var(--border);border-radius:8px;padding:10px;color:white;min-width:0}header{padding:15px 20px;background:#1b2138;display:flex;align-items:center;justify-content:space-between;gap:10px}h1{margin:0;font-size:21px}header a{color:#bcb4ff}.layout{max-width:1550px;margin:auto;padding:14px;display:grid;grid-template-columns:255px 1fr;gap:13px}.panel{border-radius:15px;background:var(--panel);border:1px solid var(--border);padding:15px}.panel h2{font-size:15px;margin:0 0 12px}.stack{display:grid;gap:10px}.row{display:flex;gap:7px;align-items:center;flex-wrap:wrap}.row>*{min-width:0}.tools{display:grid;grid-template-columns:1fr 1fr;gap:7px}.tools button{font-size:13px}label{color:var(--muted);font-size:13px;display:block}input[type=color]{width:56px;height:39px;padding:0;background:transparent;border:0}input[type=range]{width:100%}.status{font-size:13px;color:#c9d1e5;line-height:1.5}#participants{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}#participants span{border-radius:20px;padding:4px 8px;font-size:12px;background:#343e60}.boardTop{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:11px;align-items:center}.boardTop .spacer{flex:1}.boardWrap{overflow:auto;border-radius:13px;min-height:260px;background:#2e3855;background-image:radial-gradient(#60698e 1px,transparent 1px);background-size:18px 18px;padding:10px}canvas{display:block;width:100%;height:auto;max-width:1100px;margin:auto;background:#fff;touch-action:none;cursor:crosshair;box-shadow:0 10px 30px #0004}.help{color:var(--muted);font-size:12px;line-height:1.5}#notice{min-height:21px;color:#ffdf92;font-size:13px}#roomDisplay{font-weight:750;color:#c8bdff}#share{word-break:break-all;font-size:12px;color:#aeb9d1}#roomControls{display:grid;gap:8px}.toggle{display:flex;align-items:center;gap:6px}input[type=checkbox]{accent-color:var(--accent)}@media(max-width:750px){.layout{display:flex;flex-direction:column}.tools{grid-template-columns:repeat(4,1fr)}header h1{font-size:18px}.boardWrap{padding:5px}.panel{padding:12px}}
</style></head><body>
<header><h1>🎨 Formwheel Whiteboard</h1><a href="https://semicolonxss.github.io/Formwheel/">← Hub</a></header>
<div class="layout"><aside class="panel stack">
<h2>👥 함께 그리기</h2><div id="roomControls"><label>내 닉네임</label><input id="nickname" maxlength="24" placeholder="닉네임">
<button id="create" class="primary">+ 새 방 만들기</button><div class="row"><input id="roomCode" maxlength="8" placeholder="방 코드" style="flex:1;text-transform:uppercase"><button id="join">참가</button></div>
<div id="roomDisplay">방에 참가하지 않았어요</div><button id="copy" disabled>🔗 초대 링크 복사</button><button id="leave" disabled>방 나가기</button><div id="share"></div></div>
<div class="status" id="status">연결 준비 중…</div><div><strong>참가자</strong><div id="participants">—</div></div><hr style="border:0;border-top:1px solid var(--border);width:100%">
<h2>🖌 도구</h2><div class="tools" id="tools"><button data-tool="pen" class="selected">✏️ 펜</button><button data-tool="eraser">🧽 지우개</button><button data-tool="line">📏 직선</button><button data-tool="rect">▭ 사각형</button><button data-tool="ellipse">◯ 타원</button></div>
<label>색상 <input id="color" type="color" value="#6554df"></label><label>굵기 <b id="widthValue">6</b>px</label><input id="width" type="range" min="1" max="50" value="6">
<label class="toggle"><input id="fill" type="checkbox"> 도형 채우기</label>
<p class="help">누구나 새 방을 만들고 코드로 친구를 초대할 수 있어요. 그림은 같은 방의 모든 참가자에게 실시간으로 표시됩니다.</p></aside>
<main class="panel"><div class="boardTop"><button id="undo" disabled>↶ 내 마지막 그림 취소</button><button id="clear" disabled>🗑 전체 지우기</button><span class="spacer"></span><button id="download">⬇ PNG 저장</button></div>
<div class="boardWrap"><canvas id="board" width="1200" height="750" aria-label="공동 그림판"></canvas></div><p id="notice" role="status"></p><p class="help">마우스와 터치를 지원합니다. 방 안에서는 모든 사람이 그림을 그리고 지울 수 있어요. 전체 지우기는 방장만 가능합니다. 익명 로그인은 그림 동기화를 위한 인증이며 Firebase 설정에 따라 추가 권한 규칙이 필요합니다.</p></main></div>
<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js';
import {getAuth,signInAnonymously,onAuthStateChanged} from 'https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js';
import {getDatabase,ref,set,get,push,remove,onChildAdded,onChildRemoved,onValue,onDisconnect,serverTimestamp,runTransaction} from 'https://www.gstatic.com/firebasejs/10.12.5/firebase-database.js';
const app=initializeApp({apiKey:"AIzaSyBreTSe1m0-xlbF4aupnU5isRZCihR25IE",authDomain:"formwheel.firebaseapp.com",databaseURL:"https://formwheel-default-rtdb.firebaseio.com",projectId:"formwheel",storageBucket:"formwheel.firebasestorage.app",messagingSenderId:"431583088241",appId:"1:431583088241:web:74e0e34ea1e3e1170c55d0"});
const auth=getAuth(app),db=getDatabase(app),$=id=>document.getElementById(id),canvas=$('board'),ctx=canvas.getContext('2d');
const BASE='whiteboardRooms';let uid=null,room=null,owner=null,tool='pen',drawing=false,points=[],start=null,active=[],actions=new Map(),unsubs=[],myKeys=[],preview=null;
ctx.fillStyle='white';ctx.fillRect(0,0,canvas.width,canvas.height);
function notify(msg){$('notice').textContent=msg}
function enabled(v){$('undo').disabled=!v;$('copy').disabled=!v;$('leave').disabled=!v;$('clear').disabled=!v||uid!==owner}
function paintAction(a){if(!a||!Array.isArray(a.points)||!a.points.length)return;const p=a.points,c=a.color||'#111111',w=Math.max(1,Math.min(50,Number(a.width)||5));ctx.save();ctx.lineWidth=w;ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle=a.tool==='eraser'?'#ffffff':c;ctx.fillStyle=a.tool==='eraser'?'#ffffff':c;ctx.beginPath();if(a.tool==='pen'||a.tool==='eraser'){ctx.moveTo(p[0][0],p[0][1]);if(p.length===1){ctx.arc(p[0][0],p[0][1],w/2,0,Math.PI*2);ctx.fill()}else{for(let i=1;i<p.length;i++)ctx.lineTo(p[i][0],p[i][1]);ctx.stroke()}}else if(p.length>=2){const [x,y]=p[0], [X,Y]=p[1];if(a.tool==='line'){ctx.moveTo(x,y);ctx.lineTo(X,Y);ctx.stroke()}else if(a.tool==='rect'){a.fill?ctx.fillRect(Math.min(x,X),Math.min(y,Y),Math.abs(X-x),Math.abs(Y-y)):ctx.strokeRect(Math.min(x,X),Math.min(y,Y),Math.abs(X-x),Math.abs(Y-y))}else if(a.tool==='ellipse'){ctx.ellipse((x+X)/2,(y+Y)/2,Math.max(.01,Math.abs(X-x)/2),Math.max(.01,Math.abs(Y-y)/2),0,0,Math.PI*2);a.fill?ctx.fill():ctx.stroke()}}ctx.restore()}
function repaint(){ctx.fillStyle='white';ctx.fillRect(0,0,canvas.width,canvas.height);for(const a of actions.values())paintAction(a);if(preview)paintAction(preview)}
function at(e){const r=canvas.getBoundingClientRect();return [Math.round(Math.max(0,Math.min(canvas.width,(e.clientX-r.left)*canvas.width/r.width))),Math.round(Math.max(0,Math.min(canvas.height,(e.clientY-r.top)*canvas.height/r.height)))]}
function action(p){return {uid,tool,color:$('color').value,width:Number($('width').value),fill:$('fill').checked,points:p,createdAt:Date.now()}}
function off(){unsubs.forEach(fn=>fn());unsubs=[]}
async function leave(){const prev=room;off();room=null;owner=null;actions.clear();myKeys=[];preview=null;repaint();enabled(false);$('roomDisplay').textContent='방에 참가하지 않았어요';$('participants').textContent='—';$('share').textContent='';if(prev&&uid)try{await remove(ref(db,BASE+'/'+prev+'/presence/'+uid))}catch(e){}}
async function enter(code){code=code.toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,8);if(!uid){notify('로그인을 확인해 주세요.');return}if(!code){notify('방 코드를 입력해 주세요.');return}if(room===code)return;await leave();const root=BASE+'/'+code;
try{const snap=await get(ref(db,root+'/meta'));if(!snap.exists())throw Error('존재하지 않는 방입니다.');owner=snap.val().owner;room=code;let name=$('nickname').value.trim().slice(0,24)||'익명 화가';localStorage.setItem('fw-whiteboard-name',name);
const presence=ref(db,root+'/presence/'+uid);await onDisconnect(presence).remove();await set(presence,{name,joinedAt:serverTimestamp()});
unsubs.push(onChildAdded(ref(db,root+'/actions'),s=>{if(s.val()){actions.set(s.key,s.val());if(s.val().uid===uid&&!myKeys.includes(s.key))myKeys.push(s.key);repaint()}}));
unsubs.push(onChildRemoved(ref(db,root+'/actions'),s=>{actions.delete(s.key);myKeys=myKeys.filter(k=>k!==s.key);repaint()}));
unsubs.push(onValue(ref(db,root+'/presence'),s=>{const users=Object.values(s.val()||{});$('participants').replaceChildren(...users.map(u=>{let el=document.createElement('span');el.textContent=u.name||'익명';return el}));if(!users.length)$('participants').textContent='—'}));
unsubs.push(onValue(ref(db,root+'/meta/owner'),s=>{owner=s.val();enabled(!!room)}));
$('roomDisplay').textContent='방 코드: '+code;$('roomCode').value=code;$('share').textContent=location.origin+location.pathname+'?room='+encodeURIComponent(code);enabled(true);$('status').textContent='🟢 '+code+' 방에 연결됨';notify('친구에게 초대 링크를 보내 보세요!');
}catch(e){await leave();notify('방 참가 실패: '+e.message);$('status').textContent='연결 실패'}}
$('create').onclick=async()=>{if(!uid){notify('로그인 중입니다.');return}const code=Array.from(crypto.getRandomValues(new Uint8Array(6)),x=>'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'[x%32]).join('');try{const r=await runTransaction(ref(db,BASE+'/'+code+'/meta'),current=>current===null?{owner:uid,createdAt:Date.now()}:undefined,{applyLocally:false});if(!r.committed)throw Error('방 코드 중복, 다시 눌러 주세요');await enter(code)}catch(e){notify('방 생성 실패: '+e.message)}};
$('join').onclick=()=>enter($('roomCode').value);
$('roomCode').onkeydown=e=>{if(e.key==='Enter')$('join').click()};
$('copy').onclick=async()=>{const url=location.origin+location.pathname+'?room='+encodeURIComponent(room);try{await navigator.clipboard.writeText(url);notify('초대 링크를 복사했어요!')}catch(e){notify('복사할 수 없어요. '+url)}};
$('leave').onclick=async()=>{await leave();history.replaceState(null,'',location.pathname);$('status').textContent='방에서 나왔어요'};
$('tools').onclick=e=>{const b=e.target.closest('button[data-tool]');if(!b)return;tool=b.dataset.tool;document.querySelectorAll('[data-tool]').forEach(v=>v.classList.toggle('selected',v===b))};
$('width').oninput=()=>{$('widthValue').textContent=$('width').value};
canvas.onpointerdown=e=>{if(!room||!uid||e.button!==0)return;e.preventDefault();drawing=true;points=[at(e)];preview=action(points);canvas.setPointerCapture(e.pointerId);repaint()};
canvas.onpointermove=e=>{if(!drawing)return;e.preventDefault();const p=at(e);if(tool==='pen'||tool==='eraser'){const q=points[points.length-1];if(Math.hypot(p[0]-q[0],p[1]-q[1])>=2&&points.length<1500)points.push(p)}else points=[points[0],p];preview=action(points);repaint()};
async function finish(e){if(!drawing)return;drawing=false;if(e&&e.type==='pointercancel'){preview=null;repaint();return}const p=at(e);if(tool!=='pen'&&tool!=='eraser')points=[points[0],p];const a=action(points);preview=null;repaint();if(!room)return;try{await push(ref(db,BASE+'/'+room+'/actions'),a)}catch(err){notify('그림 동기화 실패: '+err.message)}}
canvas.onpointerup=finish;canvas.onpointercancel=finish;
$('undo').onclick=async()=>{if(!room||!myKeys.length)return;const last=myKeys[myKeys.length-1];try{await remove(ref(db,BASE+'/'+room+'/actions/'+last))}catch(e){notify('되돌리기 실패: '+e.message)}};
$('clear').onclick=async()=>{if(!room||uid!==owner)return;if(!confirm('모든 친구의 그림을 지울까요?'))return;try{await remove(ref(db,BASE+'/'+room+'/actions'))}catch(e){notify('전체 지우기 실패: '+e.message)}};
$('download').onclick=()=>{const a=document.createElement('a');a.href=canvas.toDataURL('image/png');a.download='formwheel-whiteboard-'+(room||'drawing')+'.png';a.click()};
$('nickname').value=localStorage.getItem('fw-whiteboard-name')||'';
onAuthStateChanged(auth,u=>{uid=u?.uid||null;if(uid){$('status').textContent='🟢 연결 준비 완료';const code=new URLSearchParams(location.search).get('room');if(code&&!room)enter(code)}else{$('status').textContent='로그인 필요'}});
signInAnonymously(auth).catch(e=>{notify('Firebase 익명 로그인 실패: '+e.message+' (Firebase Authentication에서 익명 로그인을 활성화해야 합니다.)');$('status').textContent='🔴 Firebase 인증 실패'});
</script></body></html>
